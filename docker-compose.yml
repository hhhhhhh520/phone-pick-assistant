# 手机选购助手 - Docker Compose 配置
# 开发环境使用，生产环境请使用 docker-compose.prod.yml

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: phone-assistant-backend
    ports:
      - "8002:8002"
    environment:
      - APP_ENV=development
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: phone-assistant-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: phone-assistant-network